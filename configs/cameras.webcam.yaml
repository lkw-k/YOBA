# 웹캠 테스트용 카메라 설정. `uv run ywhob --webcam [번호]`가 이 파일을 쓴다.
# url의 webcam:N은 PC에 연결된 N번 카메라 (노트북 내장 0, USB 웹캠 보통 1).
# --webcam 번호를 주면 url의 번호를 그 값으로 바꿔 쓴다.
#
# 화면 전체를 한 구역으로 센다. 웹캠 해상도와 상관없이 덮도록 ROI를 크게 잡았다.

cameras:
  - id: webcam
    url: webcam:0
    zones:
      - zone_id: webcam_all
        roi: [[0, 0], [10000, 0], [10000, 10000], [0, 10000]]
        capacity: 6           # 웹캠 화면에 들어오는 인원 기준 (잠정: 테스트용, 단계 확인하기 쉽게 작게 잡음)
